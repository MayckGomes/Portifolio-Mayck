<style>
:root{
  --bg:#0a0a0c; --bg2:#121216; --fg:#f2f2ee; --mut:#85858c; --line:#25252b; --acc:#00d2be;
  --display:'Anton',Impact,sans-serif; --body:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;background:var(--bg);overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.loading{overflow:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc);color:#000}
img,svg{display:block}

/* grain */
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* loader */
.loader{position:fixed;inset:0;z-index:100;background:var(--acc);color:#000;display:flex;align-items:flex-end;justify-content:space-between;padding:4vw;
  transition:transform 1s var(--ease)}
.loader .count{font-family:var(--display);font-size:clamp(7rem,28vw,24rem);line-height:.8}
.loader .tag{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;padding-bottom:1rem}
body.ready .loader{transform:translateY(-101%)}

/* cursor */
.cur,.cur-dot{position:fixed;top:0;left:0;z-index:95;pointer-events:none;border-radius:50%}
.cur{width:42px;height:42px;border:1px solid var(--acc);margin:-21px 0 0 -21px;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s}
.cur-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--acc)}
.cur.big{width:96px;height:96px;margin:-48px 0 0 -48px;background:var(--acc);mix-blend-mode:difference}
@media(hover:none){.cur,.cur-dot{display:none}}
@media(hover:hover) and (prefers-reduced-motion:no-preference){body{cursor:none}a,button{cursor:none}}
@media(prefers-reduced-motion:reduce){.cur,.cur-dot,.glow{display:none}}
@media(hover:none){.glow{display:none}.grain{display:none}nav{mix-blend-mode:normal;background:linear-gradient(var(--bg),transparent)}}
@media(prefers-reduced-motion:reduce){.grain{display:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:4px}
.skip{position:fixed;left:1rem;top:-5rem;z-index:130;background:var(--acc);color:#000;padding:.7rem 1rem;border-radius:8px;font-weight:700;transition:top .2s}
.skip:focus{top:1rem}

.glow{position:fixed;top:0;left:0;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(0,210,190,.10),transparent 60%)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 4vw;
  mix-blend-mode:difference;color:#fff;transition:transform .6s var(--ease)}
nav.hide{transform:translateY(-110%)}
.logo{font-family:var(--display);font-size:1.7rem;letter-spacing:.02em}
nav ul{display:flex;gap:2rem;list-style:none;font-size:.82rem;text-transform:uppercase;letter-spacing:.15em;font-weight:500}
nav ul a{position:relative;padding:.2rem 0}
nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
nav ul a:hover::after{transform:scaleX(1);transform-origin:left}
.clock{font-size:.8rem;letter-spacing:.1em;font-variant-numeric:tabular-nums}
@media(max-width:760px){nav ul{display:none}}

/* progress */
.prog{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);z-index:60}

/* split text */
.line{display:block;overflow:hidden;padding:.04em 0 .12em}
.ch{display:inline-block;transform:translateY(110%) rotate(6deg);transition:transform 1.1s var(--ease);transition-delay:calc(var(--i)*55ms + var(--d,0ms))}
body.ready .ch,.in .ch{transform:none}
.sp{display:inline-block;width:.25em}

/* hero */
.hero{position:relative;min-height:100svh;padding:0 4vw;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:7vh;overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3.8rem,14.5vw,16rem);line-height:.84;text-transform:uppercase;letter-spacing:-.01em;position:relative;z-index:2}
.hero h1 .out .ch{color:transparent;-webkit-text-stroke:2px var(--fg);transition:transform 1.1s var(--ease),color .4s,-webkit-text-stroke-color .4s;transition-delay:calc(var(--i)*55ms + var(--d,0ms)),0s,0s}
.hero h1 .out:hover .ch{color:var(--acc);-webkit-text-stroke-color:var(--acc)}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;margin-top:3vh;position:relative;z-index:2;
  opacity:0;transform:translateY(20px);transition:all 1.2s var(--ease) 1s}
body.ready .hero-meta{opacity:1;transform:none}
.role{font-size:clamp(1rem,1.6vw,1.4rem);max-width:28ch;line-height:1.35}
.role b{color:var(--acc);font-weight:500}
.scroll-hint{display:flex;align-items:center;gap:.8rem;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.scroll-hint i{display:block;width:1px;height:48px;background:var(--line);position:relative;overflow:hidden}
.scroll-hint i::after{content:"";position:absolute;inset:0;background:var(--acc);animation:drip 1.8s var(--ease) infinite}
@keyframes drip{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}
.badge{position:absolute;top:18vh;right:5vw;width:min(18vw,190px);min-width:110px;z-index:1;animation:spin 18s linear infinite}
.badge text{font-size:9px;fill:var(--fg);text-transform:uppercase;font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-wrap{position:absolute;top:18vh;right:5vw;width:min(18vw,190px);min-width:110px;aspect-ratio:1;z-index:1}
.badge-wrap .badge{position:static;width:100%}
.badge-wrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:var(--acc)}
.stripes{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5}
.stripes i{position:absolute;left:-10%;width:130%;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);transform:rotate(-12deg);opacity:.25;animation:dash 4s linear infinite}
@keyframes dash{0%{transform:translateX(-30%) rotate(-12deg)}100%{transform:translateX(30%) rotate(-12deg)}}

/* marquee */
.marq{background:var(--acc);color:#000;transform:rotate(-2deg);margin:6vh -3vw;padding:1.1rem 0;overflow:hidden;position:relative;z-index:3;white-space:nowrap}
.marq-track{display:inline-flex;will-change:transform}
.marq span{font-family:var(--display);font-size:clamp(2rem,5vw,4.5rem);text-transform:uppercase;padding-right:2.2rem;display:inline-flex;align-items:center;gap:2.2rem}
.marq span::after{content:"✦";font-size:.6em}

/* sections */
section{position:relative;z-index:1}
.sec-label{font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:1rem;margin-bottom:3rem}
.sec-label::before{content:"";width:2.5rem;height:1px;background:var(--acc)}
.pad{padding:14vh 4vw}

/* about */
.about p.big{font-family:var(--display);font-size:clamp(2rem,5.4vw,5.6rem);line-height:1.08;text-transform:uppercase;max-width:20ch}
.about p.big .w{opacity:.14;transition:opacity .3s}
.about p.big .w.on{opacity:1}
.about p.big .w.hl.on{color:var(--acc)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem;margin-top:10vh;border-top:1px solid var(--line);padding-top:2rem}
.fact small{display:block;color:var(--mut);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.6rem}
.fact b{font-weight:500;font-size:1.1rem}

/* extras */
.cv{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:.5rem 1rem;color:var(--fg);transition:border-color .3s,color .3s,background .3s}
.cv:hover{border-color:var(--acc);color:var(--acc)}
.avail{display:inline-flex;align-items:center;gap:.7rem;font-size:.82rem;letter-spacing:.1em;border:1px solid var(--line);border-radius:99px;padding:.6rem 1.2rem;margin-bottom:1rem}
.avail[hidden]{display:none}
.avail i{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(0,210,190,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .7rem rgba(0,210,190,0)}100%{box-shadow:0 0 0 0 rgba(0,210,190,0)}}
.tag.store{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.card:hover .tag.store{color:#000;border-color:var(--acc)}

/* foto */
.about-grid{display:block}
.about-grid.has-photo{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,32vw);gap:5vw;align-items:center}
.about-grid.has-photo p.big{font-size:clamp(1.9rem,4.3vw,4.8rem)}
.photo{position:relative;margin:0;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--bg2);
  opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.photo[hidden]{display:none}
.photo.in{opacity:1;transform:none}
.ph-in{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 20%)}
.photo.broken img{display:none}
.photo.broken::before{content:attr(data-msg);position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;white-space:pre-wrap;word-break:break-all;color:var(--mut);font-size:.8rem;border:1px dashed var(--line);border-radius:6px;z-index:2}
@media(max-width:899px){.about-grid.has-photo{grid-template-columns:1fr;gap:3rem}.photo{max-width:420px}}

/* horizontal projects */
.hs{position:relative}
.hs-sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:4.5rem 0 1.5rem}
.hs-head{padding:0 4vw;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4vh}
.hs-head h2{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,min(7.5vw,10vh),7rem);line-height:.9;text-transform:uppercase}
.hs-head h2 em{font-style:normal;color:var(--acc)}
.hs-bar{height:2px;background:var(--line);margin:0 4vw 3vh;position:relative;overflow:hidden}
.hs-bar i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0)}
.hs-track{display:flex;align-items:stretch;gap:2.2vw;padding:0 4vw;flex:1 1 auto;min-height:340px;max-height:420px;will-change:transform}
.card{flex:0 0 auto;width:min(64vw,720px);height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:1.8rem;
  display:grid;grid-template-rows:auto minmax(1.2rem,1fr) auto;position:relative;overflow:hidden;transform-style:preserve-3d;
  transition:border-color .4s,transform .25s ease-out}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,0%),rgba(0,210,190,.14),transparent 45%);opacity:0;transition:opacity .4s}
.card:hover{border-color:var(--acc)}
.card:hover::before{opacity:1}
.card .num{font-family:var(--display);font-size:clamp(5rem,12vw,11rem);line-height:.8;color:transparent;-webkit-text-stroke:1px #3a3a42;position:absolute;right:1.5rem;top:1rem;transition:-webkit-text-stroke-color .4s}
.card:hover .num{-webkit-text-stroke-color:var(--acc)}
.card .top{display:flex;gap:.5rem;flex-wrap:wrap;align-content:flex-start;align-self:start;grid-row:1;max-height:4rem;overflow:hidden;position:relative;max-width:70%}
.card .txt{grid-row:3;min-width:0}
.tag{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:.35rem .8rem;color:var(--mut);transition:all .3s}
.card:hover .tag{border-color:#3d3d46;color:var(--fg)}
.card h3{font-family:var(--display);font-weight:400;font-size:clamp(2rem,3.6vw,3.2rem);line-height:.95;text-transform:uppercase;margin-bottom:.8rem;padding:.08em 0 .02em;position:relative}
.card:not(.end-card) h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{color:#b4b4ba;max-width:46ch;line-height:1.5;font-size:1rem;position:relative;min-height:4.5em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .go{margin-top:1rem;display:inline-flex;align-items:center;gap:.7rem;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;position:relative}
.card .go b{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--acc);color:#000;transition:transform .5s var(--ease)}
.card:hover .go b{transform:rotate(-45deg) scale(1.15)}
.end-card{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1rem;background:var(--acc);color:#000;border-color:var(--acc)}
.end-card h3{color:#000}
.end-card .num{display:none}
@media(max-width:899px){
  .hs{height:auto!important}
  .hs-sticky{position:static;height:auto;overflow:visible;padding:0 0 10vh}
  .hs-bar{display:none}
  .hs-track{flex:none;min-height:0;max-height:none;flex-direction:column;transform:none!important;gap:1.2rem}
  .card{width:100%;height:400px;padding:1.6rem}
  .card .top{max-width:100%;max-height:6rem}
  .card p{-webkit-line-clamp:4;min-height:6em}
  .card.has-img{height:640px}
  .hs-head{flex-direction:column;align-items:flex-start;gap:1rem}
}

/* imagem do projeto */
.card .num{z-index:0}
.card .top,.card .txt{position:relative;z-index:1}
.card .cimg{position:absolute;top:0;right:0;bottom:0;width:40%;overflow:hidden;margin:0;z-index:0}
.card .cimg img{width:100%;height:100%;object-fit:cover;object-position:var(--ipos,50% 0%);transition:transform .8s var(--ease)}
.card .cimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg2),transparent 50%)}
.card:hover .cimg img{transform:scale(1.05)}
.card.has-img .num{display:none}
.card.has-img .top{max-width:56%}
.card.has-img .txt{max-width:58%}
.card.has-img h3{font-size:clamp(2rem,3.7vw,3.5rem)}
@media(max-width:899px){
  .card .cimg{position:relative;grid-row:2;align-self:center;width:100%;height:200px;border-radius:12px}
  .card .cimg::after{display:none}
  .card.has-img .top,.card.has-img .txt{max-width:100%}
}

/* stack */
.stack-grid{display:flex;flex-wrap:wrap;gap:.9rem}
.chip{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,3.2rem);text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:.4rem 1.6rem .55rem;
  transition:all .45s var(--ease);position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;inset:0;background:var(--acc);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.chip{z-index:0;isolation:isolate}
.chip:hover{color:#000;border-color:var(--acc);transform:translateY(-6px) rotate(-2deg)}
.chip:hover::before{transform:none}

/* timeline */
.tl{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);padding:2rem 0;display:grid;grid-template-columns:140px 1fr auto;gap:1rem 2rem;align-items:start;position:relative;transition:padding .5s var(--ease)}
.row::before{content:"";position:absolute;left:-4vw;right:-4vw;top:0;bottom:0;background:var(--bg2);opacity:0;transition:opacity .4s;z-index:-1}
.row:hover::before{opacity:1}
.row .yr{color:var(--mut);font-size:.85rem;letter-spacing:.12em;padding-top:.7rem}
.row h4{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,3.6vw,3.4rem);text-transform:uppercase;line-height:1;transition:transform .5s var(--ease),color .3s}
.row:hover h4{transform:translateX(1.2rem);color:var(--acc)}
.row .where{color:var(--mut);padding-top:.7rem;text-align:right}
.row .more{grid-column:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.row .more>div{overflow:hidden;color:#b4b4ba;line-height:1.55;max-width:56ch}
.row:hover .more{grid-template-rows:1fr}
@media(max-width:700px){.row{grid-template-columns:1fr}.row .more{grid-column:1;grid-template-rows:1fr}.row .where{text-align:left}.row .yr{padding:0}}

/* contact */
.contact{text-align:center;overflow:hidden}
.contact h2{font-family:var(--display);font-weight:400;font-size:clamp(3rem,13vw,17rem);line-height:.88;text-transform:uppercase;white-space:nowrap}
.contact h2 .out .ch{color:transparent;-webkit-text-stroke:2px var(--fg)}
.mail{display:inline-flex;align-items:center;justify-content:center;width:clamp(150px,16vw,210px);aspect-ratio:1;border-radius:50%;background:var(--acc);color:#000;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;margin:6vh 0 4vh;text-align:center;line-height:1.3;will-change:transform}
.socials{display:flex;gap:2.4rem;justify-content:center;flex-wrap:wrap;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase}
.socials a{position:relative;padding-bottom:.3rem}
.socials a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.socials a:hover::after{transform:scaleX(1);transform-origin:left}
.socials a:hover{color:var(--acc)}
footer{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:2rem 4vw;border-top:1px solid var(--line);color:var(--mut);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;position:relative;z-index:1}

/* reveal */
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .ch{transform:none}.rv{opacity:1;transform:none}.about p.big .w{opacity:1}
}

</style>
</head>
<body class="loading">

<a class="skip" href="#sobre">Pular para o conteúdo</a>
<div class="grain"></div>
<div class="glow" id="glow"></div>
<div class="cur" id="cur"></div><div class="cur-dot" id="dot"></div>
<div class="prog" id="prog"></div>

<div class="loader" aria-hidden="true">
  <div class="tag" id="ldTag"></div>
  <div class="count" id="count">0</div>
</div>

<nav id="nav">
  <a href="#top" class="logo" id="logo" data-cursor>MG</a>
  <ul>
    <li><a href="#sobre">Sobre</a></li>
    <li><a href="#projetos">Projetos</a></li>
    <li><a href="#stack">Stack</a></li>
    <li><a href="#trajetoria">Trajetória</a></li>
    <li><a href="#contato">Contato</a></li>
  </ul>
  <div class="clock" id="clock"></div>
</nav>

<header class="hero" id="top">
  <div class="stripes"><i style="top:25%"></i><i style="top:45%;animation-delay:-1.4s"></i><i style="top:65%;animation-delay:-2.6s"></i></div>
  <div class="badge-wrap" data-speed="-0.15">
    <svg class="badge" viewBox="0 0 120 120"><defs><path id="circ" d="M60,60 m-47,0 a47,47 0 1,1 94,0 a47,47 0 1,1 -94,0"/></defs>
      <text><textPath id="badgeText" href="#circ"></textPath></text></svg>
    <span>↓</span>
  </div>
  <h1 id="h1"></h1>
  <div class="hero-meta">
    <p class="role" id="roleBox"></p>
    <div class="scroll-hint">Role<i></i></div>
  </div>
</header>

<div class="marq" aria-hidden="true"><div class="marq-track" id="marq"></div></div>

<section class="about pad" id="sobre">
  <div class="sec-label rv">01 — Sobre</div>
  <div class="about-grid" id="aboutGrid">
    <p class="big" id="bigtext"></p>
    <figure class="photo" id="photo" data-observe hidden><div class="ph-in"><img id="photoImg" alt="" decoding="async"></div></figure>
  </div>
  <div class="facts" id="facts"></div>
</section>

<section class="hs" id="projetos">
  <div class="hs-sticky">
    <div class="hs-head"><h2>Projetos<br><em>selecionados</em></h2><div class="sec-label" style="margin:0">02 — Trabalho</div></div>
    <div class="hs-bar"><i id="hsbar"></i></div>
    <div class="hs-track" id="track"></div>
  </div>
</section>

<section class="pad" id="stack">
  <div class="sec-label rv">03 — Stack</div>
  <div class="stack-grid" id="stackgrid"></div>
</section>

<section class="pad" id="trajetoria">
  <div class="sec-label rv">04 — Trajetória</div>
  <div class="tl" id="tl"></div>
</section>

<section class="pad contact" id="contato">
  <div class="sec-label rv" style="justify-content:center">05 — Contato</div>
  <h2><span class="line"><span data-split data-observe>Vamos</span></span><span class="line out"><span data-split data-observe data-d="200">conversar</span></span></h2>
  <div class="avail" id="avail" hidden><i></i><span id="availTxt"></span></div><br>
  <a href="mailto:" class="mail" id="mail" data-magnetic data-cursor>Enviar<br>e-mail</a>
  <div class="socials" id="socials"></div>
</section>

<footer><span id="ftL"></span><span id="clock2"></span><a href="#top" data-cursor>Voltar ao topo ↑</a></footer>

<script src="data.js"></script>
<script>
(function(){
'use strict';
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
const lerp=(a,b,t)=>a+(b-a)*t;
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:|mailto:|\/|#)/i.test(u)?u:'#'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine=matchMedia('(hover:hover)').matches;

if(!window.PORTFOLIO){
  document.body.classList.remove('loading');
  document.body.innerHTML='<p style="padding:4rem;font:1rem sans-serif;color:#fff">data.js não foi encontrado. Deixe o data.js na mesma pasta do index.html.</p>';
  return;
}

/* ===== dados (data.js + rascunho do editor) ===== */
const EDIT=/[?&]edit(=|&|$)/.test(location.search);
const KEY='portfolio-draft-v1';
const DEFAULT=clone(window.PORTFOLIO);
let DATA=clone(DEFAULT);
if(EDIT){ try{const d=localStorage.getItem(KEY); if(d) DATA=Object.assign(clone(DEFAULT),JSON.parse(d));}catch(e){} }
const saveDraft=()=>{ try{localStorage.setItem(KEY,JSON.stringify(DATA)); return true}catch(e){return false} };

/* ===== split de letras ===== */
function split(){
  $$('[data-split]:not([data-done])').forEach(el=>{
    el.dataset.done=1;
    const txt=el.textContent; el.textContent=''; el.setAttribute('aria-label',txt);
    [...txt].forEach((c,i)=>{
      const s=document.createElement('span');
      if(c===' '){s.className='sp';}else{s.className='ch';s.textContent=c;s.style.setProperty('--i',i);}
      s.setAttribute('aria-hidden','true');
      if(el.dataset.d) s.style.setProperty('--d',el.dataset.d+'ms');
      el.appendChild(s);
    });
  });
}

/* ===== render ===== */
let words=[], parallax=[], lastUptoReset=()=>{};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});

function render(){
  const p=DATA.profile||{}, first=p.first||'', last=p.last||'';
  const full=`${first} ${last}`.trim(), yr=new Date().getFullYear();
  document.title=`${full} — ${p.role||'Portfólio'}`;
  $('#logo').textContent=((first[0]||'')+(last[0]||'')).toUpperCase()||'•';
  $('#ldTag').innerHTML=`${esc(full)}<br>Portfólio — ${yr}`;
  $('#ftL').textContent=`© ${yr} ${full}`;
  $('#h1').innerHTML=`<span class="line"><span data-split>${esc(first)}</span></span><span class="line out"><span data-split data-d="250">${esc(last)}</span></span>`;
  $('#roleBox').innerHTML=`<b>${esc(p.role)}</b><br>${esc(p.tagline)}`+(p.resumePdf?`<br><a class="cv" href="${esc(safeUrl(p.resumePdf))}" download data-cursor>↓ Currículo (PDF)</a>`:'');

  $('#bigtext').innerHTML=String(p.about||'').split('**').map((seg,i)=>
    seg.split(/(\s+)/).map(t=>(t===''||/^\s+$/.test(t))?t:`<span class="w${i%2?' hl':''}">${esc(t)}</span>`).join('')).join('');
  $('#facts').innerHTML=(DATA.facts||[]).map((f,i)=>`<div class="fact rv" style="--d:${i*100}ms"><small>${esc(f.label)}</small><b>${esc(f.value)}</b></div>`).join('');

  const ph=String(p.photo||'').trim(), fig=$('#photo'), img=$('#photoImg'), grid=$('#aboutGrid');
  fig.style.setProperty('--pos',p.photoPosition||'50% 20%');
  img.alt=ph?`Foto de ${full}`:'';
  if(ph){
    fig.hidden=false; grid.classList.add('has-photo');
    img.onload=()=>fig.classList.remove('broken');
    img.onerror=()=>{
      console.warn('[portfólio] não consegui carregar a foto:',ph);
      if(EDIT){ fig.classList.add('broken'); fig.dataset.msg='Foto não encontrada:\n'+ph; }
      else { fig.hidden=true; grid.classList.remove('has-photo'); }
    };
    if(img.getAttribute('src')!==ph){ fig.classList.remove('broken'); img.src=ph; }
  } else { fig.hidden=true; grid.classList.remove('has-photo'); }

  let mq=(DATA.marquee&&DATA.marquee.length)?DATA.marquee.slice():['•'];
  while(mq.length<6) mq=mq.concat(mq);
  $('#marq').innerHTML=[0,1,2,3].flatMap(()=>mq).map(t=>`<span>${esc(t)}</span>`).join('');

  const gh=String(p.github||'').replace(/\/+$/,''), handle=gh.split('/').pop();
  $('#track').innerHTML=(DATA.projects||[]).map((pr,i)=>{
    const tag=pr.link?'a':'div', attrs=pr.link?` href="${esc(safeUrl(pr.link))}" target="_blank" rel="noopener"`:'';
    const im=String(pr.image||'').trim();
    const fig=im?`<figure class="cimg" style="--ipos:${esc(pr.imagePosition||'50% 0%')}"><img src="${esc(im)}" alt="Captura de tela de ${esc(pr.title)}" decoding="async" onerror="var c=this.closest('.card');c.classList.remove('has-img');this.closest('.cimg').remove()"></figure>`:'';
    return `<${tag} class="card${im?' has-img':''}"${attrs} data-tilt data-cursor>
      ${fig}<div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="top">${pr.badge?`<span class="tag store">${esc(pr.badge)}</span>`:''}${(pr.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="txt"><h3>${esc(pr.title)}</h3><p>${esc(pr.desc)}</p>${pr.link?`<span class="go">${esc(pr.linkLabel||'Ver projeto')} <b>→</b></span>`:''}</div>
    </${tag}>`}).join('')+(gh?`
    <a class="card end-card" href="${esc(safeUrl(gh))}" target="_blank" rel="noopener" data-cursor>
      <h3>Tem mais<br>no GitHub</h3><span class="go">${esc(handle?'@'+handle:'GitHub')} <b>→</b></span>
    </a>`:'');

  $('#stackgrid').innerHTML=(DATA.stack||[]).map((s,i)=>`<span class="chip rv" style="--d:${Math.min(i,12)*40}ms">${esc(s)}</span>`).join('');
  $('#tl').innerHTML=(DATA.timeline||[]).map(t=>`
    <div class="row rv"><div class="yr">${esc(t.yr)}</div><h4>${esc(t.title)}</h4><div class="where">${esc(t.where)}</div>
    <div class="more"><div>${esc(t.more)}</div></div></div>`).join('');

  $('#mail').href='mailto:'+(p.email||'');
  const av=String(p.availability||'').trim(); $('#avail').hidden=!av; $('#availTxt').textContent=av;
  $('#socials').innerHTML=[p.linkedin&&['LinkedIn',p.linkedin],p.github&&['GitHub',p.github],p.resumePdf&&['Currículo PDF',p.resumePdf],p.email&&[p.email,'mailto:'+p.email]]
    .filter(Boolean).map(([l,h])=>`<a href="${esc(safeUrl(h))}"${/^http/i.test(h)?' target="_blank" rel="noopener"':''}>${esc(l)}</a>`).join('');

  split();
  words=$$('#bigtext .w'); parallax=$$('[data-speed]'); lastUptoReset();
  $$('.rv:not(.in),[data-observe]:not(.in)').forEach(el=>io.observe(el));
  sizeHS(); fitBadge(); tick();
}

/* selo giratório: ajusta o espaçamento pra fechar o círculo */
function fitBadge(){
  const base=String((DATA.profile||{}).badge||'Disponível').trim()||'Disponível';
  let t=base+' · '; while(t.length<26) t+=base+' · ';
  const tp=$('#badgeText'); tp.textContent=t; tp.setAttribute('letter-spacing','0');
  try{ const len=tp.getComputedTextLength(); tp.setAttribute('letter-spacing',Math.max(0,(292-len)/[...t].length).toFixed(2)); }catch(e){}
}

/* ===== scroll horizontal ===== */
const hs=$('#projetos'), track=$('#track'), bar=$('#hsbar');
let dist=0;
function sizeHS(){
  const mq=$('#marq'); if(mq) mq.dataset.w='';
  if(innerWidth<900){hs.style.height='auto';dist=0;track.style.transform='';return}
  dist=Math.max(0,track.scrollWidth-innerWidth);
  hs.style.height=(dist+innerHeight)+'px';
}
addEventListener('resize',()=>{sizeHS();fitBadge()});

/* ===== relógio ===== */
function tick(){
  const p=DATA.profile||{}; let t;
  try{ t=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:p.timezone||'America/Maceio'}).format(new Date()); }
  catch(e){ t=new Date().toLocaleTimeString('pt-BR'); }
  $('#clock').textContent=(p.clockLabel||'')+' '+t;
  $('#clock2').textContent=(p.location?p.location+' · ':'')+t;
}
setInterval(tick,1000);

/* ===== loader ===== */
(function(){
  const el=$('#count'); const t0=performance.now(), dur=reduce?10:1700;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur); el.textContent=Math.round((1-Math.pow(1-p,3))*100);
    if(p<1) requestAnimationFrame(step);
    else setTimeout(()=>{document.body.classList.remove('loading');document.body.classList.add('ready')},250);
  })(t0);
})();

/* ===== cursor, tilt, magnético (delegados, funcionam após re-render) ===== */
const m={x:innerWidth/2,y:innerHeight/2}, c={x:m.x,y:m.y}, g={x:m.x,y:m.y};
const curEl=$('#cur'), dotEl=$('#dot');
let tiltEl=null, magEl=null;
const reset=el=>{el.style.transform=''};
addEventListener('pointermove',e=>{
  m.x=e.clientX;m.y=e.clientY;dotEl.style.transform=`translate(${m.x}px,${m.y}px)`;
  if(!fine||reduce||!e.target.closest) return;
  const card=e.target.closest('[data-tilt]');
  if(tiltEl&&tiltEl!==card) reset(tiltEl);
  tiltEl=card;
  if(card){
    const r=card.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    card.style.transform=`perspective(900px) rotateY(${(x-.5)*8}deg) rotateX(${(.5-y)*8}deg)`;
    card.style.setProperty('--mx',x*100+'%');card.style.setProperty('--my',y*100+'%');
  }
  const mag=e.target.closest('[data-magnetic]');
  if(magEl&&magEl!==mag) reset(magEl);
  magEl=mag;
  if(mag){ const r=mag.getBoundingClientRect(); mag.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.35}px,${(e.clientY-r.top-r.height/2)*.35}px)`; }
});
document.addEventListener('pointerover',e=>{ if(e.target.closest&&e.target.closest('a,button,[data-cursor]')) curEl.classList.add('big'); });
document.addEventListener('pointerout',e=>{ if(!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('a,button,[data-cursor]'))) curEl.classList.remove('big'); });

/* ===== loop principal ===== */
const nav=$('#nav'), prog=$('#prog'), glow=$('#glow'), marqEl=$('#marq'), about=$('#sobre');
let lastY=scrollY, vel=0, mx=0, acc=0, navHidden=false, lastUpto=-1;
lastUptoReset=()=>{lastUpto=-1};
(function loop(){
  const y=scrollY, dy=y-lastY; vel=lerp(vel,dy,.12);

  /* 1) leituras de layout (todas juntas, antes de escrever) */
  if(!marqEl.dataset.w) marqEl.dataset.w=marqEl.scrollWidth/4;
  const mw=+marqEl.dataset.w;
  const hr=dist?hs.getBoundingClientRect():null;
  const ar=about.getBoundingClientRect();

  /* 2) barra do topo: histerese pra não piscar (esconde ao rolar pra baixo, mostra ao subir) */
  if(dy!==0){ if((dy>0)!==(acc>0)) acc=0; acc+=dy; }
  let hide=navHidden;
  if(y<120) hide=false; else if(acc>40) hide=true; else if(acc<-24) hide=false;
  if(hide!==navHidden){ navHidden=hide; nav.classList.toggle('hide',hide); }

  /* 3) escritas */
  c.x=lerp(c.x,m.x,.18); c.y=lerp(c.y,m.y,.18); curEl.style.transform=`translate(${c.x}px,${c.y}px)`;
  g.x=lerp(g.x,m.x,.05); g.y=lerp(g.y,m.y,.05); glow.style.transform=`translate(${g.x}px,${g.y}px)`;
  prog.style.transform=`scaleX(${y/(document.documentElement.scrollHeight-innerHeight||1)})`;

  /* faixa: sempre rolando sozinha; o scroll da página só dá um empurrão extra */
  mx-=(reduce?1:2.4)+Math.abs(vel)*.6;
  if(mw>0&&-mx>=mw) mx+=mw;
  marqEl.style.transform=`translate3d(${mx}px,0,0)`;
  if(!reduce) parallax.forEach(el=>el.style.transform=`translate3d(0,${y*parseFloat(el.dataset.speed)*-1}px,0)`);

  if(hr){
    const p=Math.min(1,Math.max(0,-hr.top/(hs.offsetHeight-innerHeight||1)));
    track.style.transform=`translate3d(${-p*dist}px,0,0)`; bar.style.transform=`scaleX(${p})`;
  }

  const ap=Math.min(1,Math.max(0,(innerHeight*.85-ar.top)/(innerHeight*.9)));
  const upto=reduce?words.length:Math.floor(ap*1.15*words.length);
  if(upto!==lastUpto){ lastUpto=upto; for(let i=0;i<words.length;i++) words[i].classList.toggle('on',i<upto); }

  lastY=y; requestAnimationFrame(loop);
})();

/* âncoras suaves */
$$('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
  const t=$(a.getAttribute('href')); if(!t)return; e.preventDefault();
  const top=a.getAttribute('href')==='#top'?0:t.getBoundingClientRect().top+scrollY;
  scrollTo({top,behavior:reduce?'auto':'smooth'});
}));

render();
document.fonts&&document.fonts.ready.then(()=>{sizeHS();fitBadge()});
addEventListener('load',()=>{sizeHS();fitBadge()});

/* editor: só carrega com ?edit e se o editor.js existir (não suba esse arquivo no deploy) */
if(EDIT){
  window.__PF={data:()=>DATA,setData:d=>{DATA=d},render,saveDraft,DEFAULT,KEY,clone,esc,$,$$};
  const s=document.createElement('script'); s.src='editor.js'; document.head.appendChild(s);
}
})();
</script>
</body>
</html>
